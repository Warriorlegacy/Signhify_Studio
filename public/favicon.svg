<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sig-main" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="sig-stroke" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="sig-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080C16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Rounded Base Tile -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#080C16" stroke="url(#sig-stroke)" stroke-width="2" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#sig-bg-glow)" />

  <!-- Flowing Ribbon 'S' Architecture -->
  <path
    d="M20 18 C26 10, 42 16, 42 26 C42 34, 22 30, 22 38 C22 46, 38 52, 44 44"
    stroke="url(#sig-main)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-Precision Center White Spark Core -->
  <circle cx="19" cy="22" r="3.5" fill="#FFFFFF" />

  <!-- Dynamic Orbit Halo -->
  <ellipse
    cx="19"
    cy="22"
    rx="8.5"
    ry="3.2"
    stroke="url(#sig-main)"
    stroke-width="1.8"
    transform="rotate(-25 19 22)"
    opacity="0.85"
  />
</svg>