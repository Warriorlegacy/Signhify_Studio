<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sh-glow" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stopColor="#22C55E" />
      <stop offset="1" stopColor="#4ADE80" />
    </linearGradient>
    <linearGradient id="sh-border" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stopColor="#22C55E" stopOpacity="0.75" />
      <stop offset="1" stopColor="#4ADE80" stopOpacity="0.25" />
    </linearGradient>
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Tile -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="#080C16" stroke="url(#sh-border)" stroke-width="1.5" />
  
  <!-- Flowing Ribbon 'S' with Neon Glow -->
  <path d="M15.5 13 A 9 9 0 0 1 31 19.5 L 27.5 25.5 A 7.5 7.5 0 0 1 17 31" stroke="url(#sh-glow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neon-blur)" />
  
  <!-- Center Spark Dot -->
  <circle cx="14.5" cy="16" r="2.4" fill="#FFFFFF" />
  
  <!-- Orbit Ring -->
  <ellipse cx="14.5" cy="16" rx="6.5" ry="2.4" stroke="url(#sh-glow)" stroke-width="1.3" transform="rotate(-20 14.5 16)" opacity="0.75" />
</svg>